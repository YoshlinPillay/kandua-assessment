    x: 0
    y: 13
    w: 36
    h: 5
    properties:
      title: How to read this dashboard
      content: |
        **Q1** Beer (1,595 servings) · **Q2** Yours Truly (207 vs Jerry's 206) · **Q3** Castle Lite (754) ·
        **Q4** 104 visits · **Q5** 1 (2019-08-31) · **Q6** Yes: 33.24 units/week, 87 of 90 weeks over 14 ·
        **Q7** R 21,587.09 saved.

        Every tile is a metric defined once in dbt (`transform/models/marts/_marts.yml`). Each answer is also
        computed in SQL (`transform/analyses/`) and independently in pandas, and `make test` asserts they match.
        Interpretation choices (what counts as "drunk", "last month", ISO weeks, rounding) are in `docs/decisions.md`.
        Tiger's Milk Lager is assumed to be a 1.2-unit beer (D-008), and prices are assumed to be ZAR (D-019).

