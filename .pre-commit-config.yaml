repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        args: [--unsafe]
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: claude-hook-tests
        name: Claude Code guard hooks behave as specified
        entry: tests/hooks/test_hooks.sh
        language: script
        pass_filenames: false
        files: ^(\.claude/hooks/|tests/hooks/)
      - id: sqlfluff-lint
        name: sqlfluff lint (dbt templater)
        entry: .venv/bin/sqlfluff lint
        language: system
        files: ^transform/.*\.sql$
      - id: terraform-fmt
        name: terraform fmt
        entry: bash -c 'command -v terraform >/dev/null || exit 0; terraform -chdir=infra/terraform fmt -check -recursive'
        language: system
        pass_filenames: false
        files: \.tf$
