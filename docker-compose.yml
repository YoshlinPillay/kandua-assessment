# Local stack. Run: cp .env.example .env (set passwords) && docker compose up -d && make pipeline
# All images are pinned and opted out of the host's Watchtower auto-updater (D-025): `:latest` broke the
# Lightdash CLI/server version pin once.
# Host ports are chosen to avoid services already running on the dev host (see CLAUDE.md).
name: juan

services:
  postgres:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  dagster-webserver:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    image: juan-dagster:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres  # container network; overrides the host-facing value in .env
      POSTGRES_PORT: "5432"
      DAGSTER_PG_URL: postgresql+psycopg2://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/dagster
    ports:
      - "3001:3000"
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      postgres:
        condition: service_healthy

  dagster-daemon:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: juan-dagster:local
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-m", "orchestration.definitions"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DAGSTER_PG_URL: postgresql+psycopg2://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/dagster
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      dagster-webserver:
        condition: service_started

  # --- Semantic layer + BI -----------------------------------------------------------------------------------
  lightdash-db:  # Lightdash's own metadata store (needs pgvector); separate from the warehouse
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightdash
      POSTGRES_USER: lightdash
      POSTGRES_PASSWORD: ${LIGHTDASH_DB_PASSWORD}
    volumes:
      - lightdash_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdash -d lightdash"]
      interval: 5s
      retries: 10

  minio:  # S3-compatible store Lightdash uses for query results and exports (see D-026 for the networking)
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    # Community build used by Lightdash's own compose (MinIO stopped publishing minio/minio and minio/mc).
    image: coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9  # pinned by digest (no version tags upstream)
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: lightdash
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Lightdash signs export links with S3_ENDPOINT, so that URL must work from BOTH the browser and the
    # Lightdash container (D-026). A nip.io name resolves to the host for the browser, and the same name is a
    # Docker network alias for this container, so Lightdash reaches MinIO internally. MinIO listens on 9100 in
    # both places so the signed URL is identical.
    ports:
      - "9100:9100"
    networks:
      default:
        aliases: ["${LIGHTDASH_S3_HOST:-127-0-0-1.nip.io}"]
    volumes:
      - minio_data:/data
      - ./docker/minio/init-minio.sh:/init-minio.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ls", "local/lightdash"]
      interval: 5s
      retries: 20

  lightdash:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: lightdash/lightdash:2.399.4
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      headless-browser:
        condition: service_started
    environment:
      PGHOST: lightdash-db
      PGPORT: "5432"
      PGUSER: lightdash
      PGPASSWORD: ${LIGHTDASH_DB_PASSWORD}
      PGDATABASE: lightdash
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}
      SITE_URL: ${LIGHTDASH_SITE_URL:-http://localhost:8100}
      PORT: "8080"
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      S3_ENDPOINT: http://${LIGHTDASH_S3_HOST:-127-0-0-1.nip.io}:9100
      S3_REGION: us-east-1
      S3_BUCKET: lightdash
      S3_ACCESS_KEY: lightdash
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      # Background worker: runs CSV/XLSX/image export jobs, not only scheduled deliveries.
      SCHEDULER_ENABLED: "true"
      # CSV/XLSX downloads go through Lightdash (/api/v1/file/...). PDF/image links are presigned with S3_ENDPOINT.
      PERSISTENT_DOWNLOAD_URLS_ENABLED: "true"
      # Image/PDF exports: the headless browser renders Lightdash via the internal network, not the LAN IP.
      HEADLESS_BROWSER_HOST: headless-browser
      HEADLESS_BROWSER_PORT: "3000"
      INTERNAL_LIGHTDASH_HOST: http://lightdash:8080
    ports:
      - "8100:8080"

  headless-browser:  # renders charts/dashboards for image and PDF exports (same image as Lightdash's compose)
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: ghcr.io/browserless/chromium:v2.49.0
    restart: unless-stopped

  lightdash-cli:  # one-shot tool: `make lightdash-deploy`. Not started by `docker compose up`.
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    build:
      context: .
      dockerfile: docker/lightdash-cli/Dockerfile
    image: juan-lightdash-cli:local
    profiles: [tools]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      LIGHTDASH_URL: http://lightdash:8080
      DBT_TARGET: reader  # Lightdash's warehouse connection uses the read-only role (security.md)
    volumes:
      - ./transform:/app/transform
      - ./docker/lightdash-cli/deploy.sh:/app/deploy.sh:ro
      - ./docker/lightdash-cli/export-dashboard.js:/app/export-dashboard.js:ro
      - ./docker/lightdash-cli/invite-users.js:/app/invite-users.js:ro
      - ./lightdash:/app/lightdash
    depends_on:
      lightdash:
        condition: service_started

  cube:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: cubejs/cube:v1.7.47
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: ${POSTGRES_DB}
      CUBEJS_DB_USER: ${POSTGRES_READER_USER}  # read-only role (security.md)
      CUBEJS_DB_PASS: ${POSTGRES_READER_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "true"  # local playground on :4000; disabled on AWS
      DBT_MANIFEST_PATH: /cube/dbt/manifest.json
      DBT_CATALOG_PATH: /cube/dbt/catalog.json  # directory mount below: single-file binds of not-yet-built
                                                # artefacts make Docker create directories in their place
    ports:
      - "4000:4000"
    volumes:
      - ./semantic/cube:/cube/conf
      - ./transform/target:/cube/dbt:ro

volumes:
  pgdata:
  dagster_home:
  lightdash_db:
  minio_data:
