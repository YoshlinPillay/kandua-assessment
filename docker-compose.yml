# Local stack. Run: cp .env.example .env (set passwords) && docker compose up -d && make pipeline
# Host ports are chosen to avoid services already running on the dev host (see CLAUDE.md).
name: juan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  dagster-webserver:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    image: juan-dagster:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres  # container network; overrides the host-facing value in .env
      POSTGRES_PORT: "5432"
    ports:
      - "3001:3000"
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      postgres:
        condition: service_healthy

  dagster-daemon:
    image: juan-dagster:local
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-m", "orchestration.definitions"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      dagster-webserver:
        condition: service_started

  # --- Semantic layer + BI -----------------------------------------------------------------------------------
  lightdash-db:  # Lightdash's own metadata store (needs pgvector); separate from the warehouse
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lightdash
      POSTGRES_USER: lightdash
      POSTGRES_PASSWORD: ${LIGHTDASH_DB_PASSWORD}
    volumes:
      - lightdash_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightdash -d lightdash"]
      interval: 5s
      retries: 10

  minio:  # S3-compatible store Lightdash uses for query results/exports. Internal only (host :9000 is taken).
    # Community build used by Lightdash's own compose (MinIO stopped publishing minio/minio and minio/mc).
    image: coollabsio/minio:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/init-minio.sh"]
    environment:
      MINIO_ROOT_USER: lightdash
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ./docker/minio/init-minio.sh:/init-minio.sh:ro
    healthcheck:
      test: ["CMD", "mc", "ls", "local/lightdash"]
      interval: 5s
      retries: 20

  lightdash:
    image: lightdash/lightdash:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      lightdash-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PGHOST: lightdash-db
      PGPORT: "5432"
      PGUSER: lightdash
      PGPASSWORD: ${LIGHTDASH_DB_PASSWORD}
      PGDATABASE: lightdash
      LIGHTDASH_SECRET: ${LIGHTDASH_SECRET}
      SITE_URL: ${LIGHTDASH_SITE_URL:-http://localhost:8100}
      PORT: "8080"
      SECURE_COOKIES: "false"
      TRUST_PROXY: "false"
      LIGHTDASH_INSTALL_TYPE: docker_image
      LIGHTDASH_MIGRATION_EXECUTION_MODE: compose
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lightdash
      S3_ACCESS_KEY: lightdash
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      SCHEDULER_ENABLED: "false"  # no headless browser: scheduled image deliveries are out of scope
    ports:
      - "8100:8080"

  cube:
    image: cubejs/cube:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_NAME: ${POSTGRES_DB}
      CUBEJS_DB_USER: ${POSTGRES_READER_USER}  # read-only role (security.md)
      CUBEJS_DB_PASS: ${POSTGRES_READER_PASSWORD}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      CUBEJS_DEV_MODE: "true"  # local playground on :4000; disabled on AWS
      DBT_MANIFEST_PATH: /cube/dbt/manifest.json
    ports:
      - "4000:4000"
    volumes:
      - ./semantic/cube:/cube/conf
      - ./transform/target/manifest.json:/cube/dbt/manifest.json:ro

volumes:
  pgdata:
  dagster_home:
  lightdash_db:
  minio_data:
