# Local stack. Run: cp .env.example .env (set passwords) && docker compose up -d && make pipeline
# Host ports are chosen to avoid services already running on the dev host (see CLAUDE.md).
name: juan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_READER_USER: ${POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  dagster-webserver:
    build:
      context: .
      dockerfile: docker/dagster/Dockerfile
    image: juan-dagster:local
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres  # container network; overrides the host-facing value in .env
      POSTGRES_PORT: "5432"
    ports:
      - "3001:3000"
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      postgres:
        condition: service_healthy

  dagster-daemon:
    image: juan-dagster:local
    restart: unless-stopped
    command: ["dagster-daemon", "run", "-m", "orchestration.definitions"]
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    volumes:
      - dagster_home:/opt/dagster/home/storage
    depends_on:
      dagster-webserver:
        condition: service_started

volumes:
  pgdata:
  dagster_home:
