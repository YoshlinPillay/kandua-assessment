# AWS overlay: docker compose -f docker-compose.yml -f docker-compose.aws.yml (used by deploy/aws/deploy.sh).
# Differences from local: warehouse = RDS over TLS (no local postgres), Lightdash results = real S3 via the
# instance role (no MinIO), only Caddy is published (HTTPS via sslip.io), plus the chat app.
services:
  postgres:
    profiles: [local-only]  # RDS instead

  minio:
    profiles: [local-only]  # S3 instead

  dagster-webserver:
    ports: !reset []
    depends_on: !reset {}
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: require

  dagster-daemon:
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: require

  lightdash:
    ports: !reset []
    depends_on: !override
      lightdash-db:
        condition: service_healthy
      headless-browser:
        condition: service_started
    environment:
      SITE_URL: ${LIGHTDASH_SITE_URL}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
      S3_ENDPOINT: https://s3.${AWS_REGION}.amazonaws.com
      S3_REGION: ${AWS_REGION}
      S3_BUCKET: ${LIGHTDASH_S3_BUCKET}
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_FORCE_PATH_STYLE: "false"
      S3_USE_CREDENTIALS_FROM: instance_metadata  # EC2 instance role, no access keys
      # Headless first boot: org + a deploy service user + its API token (generated by Terraform, in SSM).
      LD_SETUP_ORGANIZATION_NAME: Juan the Drinker
      LD_SETUP_ADMIN_NAME: Deploy Bot
      LD_SETUP_ADMIN_EMAIL: deploy@${DOMAIN}
      LD_SETUP_ADMIN_API_KEY: ${LIGHTDASH_API_KEY}
      LD_SETUP_PROJECTS: ${LIGHTDASH_SETUP_PROJECTS}  # Postgres project on RDS (read-only role, TLS)

  lightdash-cli:
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: require  # also used for Lightdash's own warehouse connection

  cube:
    ports: !reset []
    depends_on: !reset {}
    environment:
      CUBEJS_DB_HOST: ${POSTGRES_HOST}
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DB_SSL: "true"
      CUBEJS_DEV_MODE: "false"

  chat:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: juan-dagster:local  # same image: chat/ is copied in docker/dagster/Dockerfile
    restart: unless-stopped
    command: ["streamlit", "run", "chat/app.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      CUBE_URL: http://cube:4000/cubejs-api/v1
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET}
      BEDROCK_REGION: ${BEDROCK_REGION}
      CHAT_MODEL_ID: ${CHAT_MODEL_ID}
      AWS_REGION: ${AWS_REGION}  # instance role via IMDSv2 (hop limit 2 set in Terraform)
    depends_on:
      cube:
        condition: service_started

  caddy:
    labels: {com.centurylinklabs.watchtower.enable: "false"}
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH}
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [lightdash, chat, dagster-webserver]

volumes:
  caddy_data:
