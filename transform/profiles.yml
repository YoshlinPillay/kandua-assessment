# Credentials come from the environment (.env locally, SSM on AWS). Never hard-code them here.
juan:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5433') | int }}"
      dbname: "{{ env_var('POSTGRES_DB', 'juan') }}"
      user: "{{ env_var('POSTGRES_ADMIN_USER', 'juan_admin') }}"
      password: "{{ env_var('POSTGRES_ADMIN_PASSWORD', '') }}"
      schema: public
      threads: 4
