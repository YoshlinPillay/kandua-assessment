name: AWS

# Infrastructure changes stay human-triggered (CLAUDE.md rule 8): CI only *plans*. App code reaching main is
# redeployed on the EC2 host through SSM. Auth is GitHub OIDC -> IAM role (no AWS keys stored in GitHub).
# Dormant until the repository variable AWS_ROLE_ARN is set (terraform output github_actions_role_arn).

on:
  pull_request:
    paths: ["infra/terraform/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write  # OIDC
  contents: read

concurrency:
  group: aws
  cancel-in-progress: false

env:
  AWS_REGION: af-south-1
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_admin_email: ${{ vars.ADMIN_EMAIL }}

jobs:
  plan:
    if: github.event_name == 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: af-south-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4
      - name: terraform plan (read-only role)
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          terraform -chdir=infra/terraform init -input=false -backend-config="bucket=juan-tfstate-${account}"
          terraform -chdir=infra/terraform plan -input=false -lock=false -no-color

  deploy-app:
    if: github.event_name != 'pull_request' && vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: af-south-1
      - name: Redeploy on the app host via SSM
        run: |
          instance=$(aws ec2 describe-instances --filters "Name=tag:Name,Values=juan-app-host" \
            "Name=instance-state-name,Values=running" --query 'Reservations[0].Instances[0].InstanceId' --output text)
          cmd=$(aws ssm send-command --instance-ids "$instance" --document-name AWS-RunShellScript \
            --comment "GitHub ${GITHUB_SHA::7}" \
            --parameters 'commands=["source /etc/profile.d/juan.sh && /opt/juan/app/deploy/aws/deploy.sh"],executionTimeout=["3600"]' \
            --query Command.CommandId --output text)
          echo "SSM command $cmd"
          # Poll (a deploy takes minutes; `aws ssm wait command-executed` gives up after ~100 s).
          for _ in $(seq 1 120); do
            status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) sleep 15 ;; *) break ;; esac
          done
          echo "status: $status"
          aws ssm get-command-invocation --command-id "$cmd" --instance-id "$instance" \
            --query StandardOutputContent --output text | tail -20
          test "$status" = "Success"
